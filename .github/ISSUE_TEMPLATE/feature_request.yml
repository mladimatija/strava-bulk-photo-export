name: Feature request
description: Suggest a new feature or improvement.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem you're trying to solve?
      description: Describe the user need - the goal, not the implementation.
      placeholder: e.g. "I want to download all the photos from a specific trip in one zip so I can archive them on my NAS."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the extension to do?
      description: If you have an idea for the UX, describe it. Skip this if you just have a problem and want the maintainer to figure out the shape.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
      description: Other extensions, Strava's built-in export, manual scripts - what doesn't quite fit?
  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Would be nice
        - Would use it often
        - Blocking me from using the extension
    validations:
      required: true
